name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # 3. System dependencies (platform-specific)
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      # Windows: MSVC is pre-installed, nothing extra needed

      # -----------------------------------------------------------------------
      # 4. Cache Eigen headers
      # -----------------------------------------------------------------------
      - name: Cache Eigen
        uses: actions/cache@v4
        with:
          path: src/third_party/eigen
          key: eigen-3.4.0

      # -----------------------------------------------------------------------
      # 5. Python dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy pytest pytest-cov

      # -----------------------------------------------------------------------
      # 6. Build (CPU only)
      # -----------------------------------------------------------------------
      - name: Build and install package
        env:
          DRPF_DISABLE_CUDA: "1"
        run: pip install -e .

      # -----------------------------------------------------------------------
      # 7. Test
      # -----------------------------------------------------------------------
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=drpf --cov-report=xml --cov-report=term-missing

      # -----------------------------------------------------------------------
      # 8. Upload coverage (Linux + Python 3.11 only)
      # -----------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # CUDA build job — verifies the GPU backend compiles.
  # No GPU on GitHub-hosted runners, so only CPU-path tests are executed.
  # ===========================================================================
  build-cuda:
    name: Build CUDA (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Remove preinstalled CUDA repo
        run: sudo rm -f /etc/apt/sources.list.d/cuda-ubuntu*.list

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libomp-dev

      - name: Cache Eigen
        uses: actions/cache@v4
        with:
          path: src/third_party/eigen
          key: eigen-3.4.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy pytest

      - name: Build with CUDA enabled
        env:
          DRPF_CUDA_ARCH: sm_75
        run: pip install -e . -v

      - name: Import smoke test
        run: |
          python -c "import drpf; print('drpf imported OK')"

      - name: Run CPU-path tests on CUDA build
        run: pytest tests/ -v --tb=short -k "not gpu"