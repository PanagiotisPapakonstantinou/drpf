name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # 3. System dependencies (platform-specific)
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      # Windows: MSVC is pre-installed, nothing extra needed

      # -----------------------------------------------------------------------
      # 4. Cache Eigen headers
      # -----------------------------------------------------------------------
      - name: Cache Eigen
        uses: actions/cache@v4
        with:
          path: src/third_party/eigen
          key: eigen-3.4.0

      # -----------------------------------------------------------------------
      # 5. Python dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy pytest pytest-cov

      # -----------------------------------------------------------------------
      # 6. Build
      # -----------------------------------------------------------------------
      - name: Build and install package
        run: pip install -e .

      # -----------------------------------------------------------------------
      # 7. Test
      # -----------------------------------------------------------------------
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=drpf --cov-report=xml --cov-report=term-missing

      # -----------------------------------------------------------------------
      # 8. Upload coverage (Linux + Python 3.11 only)
      # -----------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false