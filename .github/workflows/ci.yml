name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # 3. System dependencies (platform-specific)
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libomp-dev

      # setup.py's configure_macos_compiler() will auto-detect libomp and
      # fall through to Apple Clang + libomp — pre-installing it here avoids
      # brew prompts mid-build and is much faster than installing llvm.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      # Windows: MSVC is pre-installed on GitHub runners.
      # setup.py already uses /openmp:experimental for MSVC — nothing needed.

      # -----------------------------------------------------------------------
      # 4. Cache Eigen headers (avoids re-downloading on every run)
      # -----------------------------------------------------------------------
      - name: Cache Eigen
        uses: actions/cache@v4
        with:
          path: src/third_party/eigen
          key: eigen-3.4.0

      # -----------------------------------------------------------------------
      # 5. Python dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy pytest pytest-cov

      # -----------------------------------------------------------------------
      # 6. Build
      # -----------------------------------------------------------------------
      - name: Build and install package
        run: pip install -e .

      # -----------------------------------------------------------------------
      # 7. Test
      # -----------------------------------------------------------------------
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=drpf --cov-report=xml --cov-report=term-missing

      # -----------------------------------------------------------------------
      # 8. Upload coverage (Linux + Python 3.11 only — avoids duplicate reports)
      # -----------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false