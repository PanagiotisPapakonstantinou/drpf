name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # -----------------------------------------------------------------------
      # 3. Install system dependencies (C++ compiler + OpenMP)
      #    The DRPF C++ backend uses OpenMP for parallel batch queries.
      # -----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libomp-dev

      # -----------------------------------------------------------------------
      # 4. Install Python build & test dependencies
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            cython \
            numpy \
            pytest \
            pytest-cov

      # -----------------------------------------------------------------------
      # 5. Build and install the package
      #    Using pip install -e . because the src/ layout means build_ext
      #    --inplace won't put the .so where pytest can find it.
      # -----------------------------------------------------------------------
      - name: Build and install package
        run: pip install -e .

        
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --cov=drpf --cov-report=term-missing


      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false